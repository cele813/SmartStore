name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smartstore_test
          POSTGRES_USER: smartstore
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstore -d smartstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Store: Host=localhost;Database=smartstore_test;Username=smartstore;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$report = Get-Content $_.FullName
            foreach ($result in $report.TestRun.Results.UnitTestResult) {
              if ($result.outcome -eq 'Failed') {
                $message = ($result.Output.ErrorInfo.Message + ' ' + $result.Output.ErrorInfo.StackTrace) -replace "`r?`n", '%0A'
                Write-Output "::error title=$($result.testName)::$message"
              }
            }
          }
      - run: dotnet ef migrations has-pending-model-changes --project src/SmartStore.Infrastructure --startup-project src/SmartStore.Api
